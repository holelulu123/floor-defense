<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor Defense Assets</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --panel-2: #262a31; --text: #e8e9ec; --muted: #9aa0a8;
    --accent: #ffb454; --good: #7bd88f; --bad: #ff6b6b; --border: #2f343c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; height: 100vh; display: grid; grid-template-columns: 300px 1fr 320px; grid-template-rows: 48px 1fr; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  header nav a { color: var(--muted); margin-right: 14px; text-decoration: none; padding: 6px 0; }
  header nav a.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
  aside { background: var(--panel); border-right: 1px solid var(--border); overflow: auto; padding: 12px; }
  aside.right { border-right: 0; border-left: 1px solid var(--border); }
  .group { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 6px; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; background: var(--panel-2); }
  .card:hover { border-color: var(--muted); }
  .card.active { border-color: var(--accent); }
  .card { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; }
  .card .thumb { width: 56px; height: 56px; border-radius: 8px; background: #2c313a; object-fit: cover; }
  .card b { display: block; }
  .card small { color: var(--muted); }
  .card .stats { display: flex; gap: 10px; margin-top: 4px; }
  .card .stats span { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
  .card .stats img { width: 14px; height: 14px; }
  input.filter { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
  #view { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 12px; top: 12px; background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  #hud .hp { width: 180px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  #hud .hp i { display: block; height: 100%; background: var(--good); width: 100%; transition: width .15s; }
  #flash { position: absolute; inset: 0; pointer-events: none; background: #fff; opacity: 0; transition: opacity .12s; }
  #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin: 0 6px 6px 0; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  select { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 4px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
  td:last-child { text-align: right; font-weight: 600; }
  td img { width: 22px; height: 22px; vertical-align: middle; margin-right: 8px; }
  label.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 48px 220px 1fr auto; } aside { max-height: 260px; } }
</style>
</head>
<body>
<header>
  <h1>Floor Defense · Assets</h1>
  <nav id="tabs">
    <a href="#creatures" data-tab="creatures">Creatures</a>
    <a href="#classes" data-tab="classes">Classes</a>
    <a href="#weapons" data-tab="weapons">Weapons</a>
    <a href="#props" data-tab="props">Props</a>
  </nav>
  <span class="note" style="margin-left:auto">Drag to orbit · wheel to zoom</span>
</header>

<aside>
  <input class="filter" id="filter" placeholder="Filter…">
  <div id="list"></div>
</aside>

<main id="view">
  <div id="flash"></div>
  <div id="empty">Pick something on the left</div>
  <div id="hud"><b id="hud-name">—</b><div id="hud-state" class="note">idle</div><div class="hp"><i id="hud-hp"></i></div></div>
</main>

<aside class="right">
  <div id="animated-controls">
    <h2>Actions</h2>
    <div>
      <button id="btn-walk" class="primary">Walk</button>
      <button id="btn-run">Run</button>
      <button id="btn-attack">Attack</button>
      <button id="btn-hit">Take a hit (−10)</button>
      <button id="btn-kill">Kill</button>
      <button id="btn-spawn">Respawn</button>
    </div>
    <h2>Any animation</h2>
    <select id="anim-select"></select>
    <label class="row"><input type="checkbox" id="chk-sound" checked> Sounds</label>
    <label class="row"><input type="checkbox" id="chk-footsteps" checked> Footsteps while walking</label>
  </div>
  <div id="static-controls" class="hidden">
    <h2>View</h2>
    <label class="row"><input type="checkbox" id="chk-spin" checked> Auto-rotate</label>
    <label class="row"><input type="checkbox" id="chk-wire"> Wireframe</label>
    <div class="note" id="dims"></div>
  </div>
  <h2>Stats</h2>
  <table id="stats"></table>
  <h2 id="sounds-h">Sounds used</h2>
  <div id="sounds" class="note"></div>
  <h2>Source</h2>
  <div id="source" class="note"></div>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';
import { FAMILIES, CLASSES, STAT_ICONS, STAT_LABELS } from './catalog.js';

const SFX = '../assets/sounds/kenney-impact/';
const ICONS = '../assets/ui/icons/';
const $ = id => document.getElementById(id);

// --- scene ------------------------------------------------------------------------------
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1f26);
scene.fog = new THREE.Fog(0x1b1f26, 14, 40);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x4a3f36, 0.9));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.8);
sun.position.set(4, 7, 3); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x2f3b2f, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
scene.add(new THREE.GridHelper(12, 12, 0x3b4450, 0x2a3038));

function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

function frame(root) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) / 2;
  const dist = radius / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.4;
  controls.target.copy(center);
  camera.position.set(center.x + dist * 0.65, center.y + dist * 0.45, center.z + dist * 0.75);
  // Zoom limits and fog scale with the model, so a knife and a boss both zoom sensibly.
  controls.minDistance = radius * 0.3;
  controls.maxDistance = dist * 8;
  scene.fog.near = dist * 4;
  scene.fog.far = dist * 12;
  camera.far = dist * 20;
  camera.updateProjectionMatrix();
  controls.update();
  ground.position.y = box.min.y - 0.001;
  return size;
}

// --- audio ------------------------------------------------------------------------------
const audioCache = new Map();
function play(name, volume = 0.8) {
  if (!$('chk-sound').checked || !name) return;
  const file = `${SFX}${name}_00${Math.floor(Math.random() * 5)}.ogg`;
  let a = audioCache.get(file);
  if (!a) { a = new Audio(file); audioCache.set(file, a); }
  const c = a.cloneNode(); c.volume = volume; c.play().catch(() => {});
}

// --- loading ----------------------------------------------------------------------------
const loader = new GLTFLoader();
const gltfCache = new Map();
function loadGltf(file) { if (!gltfCache.has(file)) gltfCache.set(file, loader.loadAsync(file)); return gltfCache.get(file); }

let current = null; // { def, root, mixer?, actions?, hp, state, stepTimer, animated }
let active = null;
const clock = new THREE.Clock();

function clear() { if (current) { scene.remove(current.root); current = null; active = null; } }

// Loads are async; if the user picks something else (or another tab) while a model is still
// loading, the late arrival must be dropped or it ends up standing behind the new model.
let loadSeq = 0;

async function showAnimated(def) {
  clear();
  const seq = ++loadSeq;
  const gltf = await loadGltf(def.model);
  if (seq !== loadSeq) return;
  const root = cloneSkinned(gltf.scene);
  root.scale.setScalar(def.scale);
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; if (def.tint) { o.material = o.material.clone(); o.material.emissive = new THREE.Color(def.tint); o.material.emissiveIntensity = 0.25; } } });
  scene.add(root);
  frame(root);
  const mixer = new THREE.AnimationMixer(root);
  const actions = {};
  for (const clip of gltf.animations) actions[clip.name] = mixer.clipAction(clip);
  const maxHp = def.stats.health ?? 100;
  current = { def, root, mixer, actions, hp: maxHp, maxHp, state: 'idle', stepTimer: 0, animated: true };

  $('anim-select').innerHTML = gltf.animations.map(c => `<option>${c.name}</option>`).join('');
  $('anim-select').value = def.anims.idle;
  $('hud-name').textContent = def.id;
  $('stats').innerHTML = Object.entries(def.stats).map(([k, v]) => `<tr><td>${STAT_ICONS[k] ? `<img src="${ICONS}${STAT_ICONS[k]}@64.png" alt="">` : ''}${STAT_LABELS[k] ?? k}</td><td>${v}</td></tr>`).join('');
  $('sounds').innerHTML = Object.entries(def.sounds).map(([k, v]) => `${k}: <code>${v}_00x.ogg</code>`).join('<br>');
  $('source').innerHTML = `Model: <b>${def.model.split('/').pop()}</b><br>${def.source ?? ''}<br>Sounds: Kenney Impact Sounds (CC0)`;
  setHp(maxHp);
  playAnim(def.anims.spawn, { once: true, then: () => playAnim(def.anims.idle) });
}

async function showStatic(item) {
  clear();
  const seq = ++loadSeq;
  const gltf = await loadGltf(item.file);
  if (seq !== loadSeq) return;
  const root = gltf.scene.clone(true);
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.material = o.material.clone(); o.material.wireframe = $('chk-wire').checked; } });
  scene.add(root);
  const size = frame(root);
  current = { def: item, root, hp: 1, maxHp: 1, state: 'static', animated: false };
  $('hud-name').textContent = item.name;
  $('hud-state').textContent = item.pack;
  $('dims').textContent = `Size: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} (model units; 1 unit ≈ 1 m, Roblox studs are ~0.28 m)`;
  $('stats').innerHTML = `<tr><td>File</td><td>${item.file.split('/').pop()}</td></tr><tr><td>Pack</td><td>${item.pack}</td></tr><tr><td>License</td><td>${item.license}</td></tr>`;
  $('source').innerHTML = `${item.pack} · ${item.license}`;
}

// A class is shown as its starting weapon plus its text; the player keeps their own avatar.
async function showClass(cls) {
  await showStatic({ file: cls.model, name: `${cls.id} · ${cls.weapon}`, pack: `${cls.tier} class · ${cls.role}`, license: 'CC0 (Kenney Weapon Pack)' });
  if (!current || current.def.file !== cls.model) return;
  $('stats').innerHTML = ['tier', 'role', 'weapon', 'passive', 'active', 'gear'].map(k => `<tr><td>${STAT_LABELS[k]}</td><td>${cls[k]}</td></tr>`).join('');
  $('source').innerHTML = 'Weapon model: Kenney Weapon Pack (CC0). Gear overlays are added on top of the player\'s own avatar in game.';
}

function playAnim(name, { once = false, then = null } = {}) {
  if (!current?.animated) return;
  let next = current.actions[name];
  if (!next) {
    // A clip the pack doesn't have: fall back to idle so the model never freezes in bind pose.
    console.warn('missing animation', name, 'for', current.def.id);
    $('hud-state').textContent = `missing clip "${name}", showing idle`;
    next = current.actions[current.def.anims.idle] ?? Object.values(current.actions)[0];
    if (!next) return;
    if (once && then) { then(); return; }
    once = false;
  }
  if (active && active !== next) active.fadeOut(0.15);
  next.reset().setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat).fadeIn(0.15).play();
  next.clampWhenFinished = once;
  active = next;
  $('hud-state').textContent = name;
  if (once && then) {
    const onDone = e => { if (e.action === next) { current.mixer.removeEventListener('finished', onDone); then(); } };
    current.mixer.addEventListener('finished', onDone);
  }
}

function setHp(v) {
  current.hp = Math.max(0, v);
  $('hud-hp').style.width = `${(current.hp / current.maxHp) * 100}%`;
  $('hud-hp').style.background = current.hp > 0 ? 'var(--good)' : 'var(--bad)';
}
function flash() { $('flash').style.opacity = 0.25; setTimeout(() => ($('flash').style.opacity = 0), 60); }

const actions = {
  walk: () => { current.state = 'walk'; playAnim(current.def.anims.walk); },
  run: () => { current.state = 'run'; playAnim(current.def.anims.run); },
  attack: () => { current.state = 'idle'; play(current.def.sounds.attack); playAnim(current.def.anims.attack, { once: true, then: () => playAnim(current.def.anims.idle) }); },
  hit: () => {
    if (current.hp <= 0) return;
    flash(); play(current.def.sounds.hit); setHp(current.hp - 10);
    if (current.hp <= 0) return actions.kill();
    const resume = current.state;
    playAnim(current.def.anims.hit, { once: true, then: () => playAnim(resume === 'walk' ? current.def.anims.walk : resume === 'run' ? current.def.anims.run : current.def.anims.idle) });
  },
  kill: () => { current.state = 'dead'; setHp(0); play(current.def.sounds.death, 1); playAnim(current.def.anims.death, { once: true }); },
  spawn: () => { current.state = 'idle'; setHp(current.maxHp); playAnim(current.def.anims.spawn, { once: true, then: () => playAnim(current.def.anims.idle) }); },
};
for (const [k, fn] of Object.entries(actions)) $(`btn-${k}`).onclick = () => current?.animated && fn();
$('anim-select').onchange = e => { current.state = 'idle'; playAnim(e.target.value); };
$('chk-wire').onchange = e => current && !current.animated && current.root.traverse(o => { if (o.isMesh) o.material.wireframe = e.target.checked; });

// --- tabs and list ----------------------------------------------------------------------
let files = { weapons: [], props: [] };
try { files = await (await fetch('./files.json')).json(); } catch (e) { console.warn('files.json missing; run scripts/showcase-index.py', e); }

const statIcon = k => STAT_ICONS[k] ? `<img src="${ICONS}${STAT_ICONS[k]}@64.png" alt="${k}">` : '';
function animatedCard(def) {
  const stats = def.stats.health !== undefined
    ? ['health', 'speed', 'damage', 'coins', 'firstWave'].map(k => `<span>${statIcon(k)}${def.stats[k]}</span>`).join('')
    : `<span>${def.stats.tier} · ${def.stats.role}</span>`;
  return `<img class="thumb" alt=""><div><b>${def.id}</b><small>${def.blurb}</small><div class="stats">${stats}</div></div>`;
}

// --- thumbnails: a small offscreen render of each model in its idle pose -----------------
const THUMB = 112;
const thumbRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
thumbRenderer.setSize(THUMB, THUMB, false);
thumbRenderer.outputColorSpace = THREE.SRGBColorSpace;
const thumbScene = new THREE.Scene();
thumbScene.add(new THREE.HemisphereLight(0xdfe6ff, 0x4a3f36, 1.2));
const thumbSun = new THREE.DirectionalLight(0xfff1dc, 1.6); thumbSun.position.set(3, 5, 4); thumbScene.add(thumbSun);
const thumbCamera = new THREE.PerspectiveCamera(35, 1, 0.05, 200);
const thumbCache = new Map();
let thumbQueue = Promise.resolve();

function renderThumb(file, { scale = 1, tint = null, idle = null } = {}) {
  const key = `${file}|${scale}|${tint}|${idle}`;
  if (thumbCache.has(key)) return thumbCache.get(key);
  const p = thumbQueue.then(async () => {
    const gltf = await loadGltf(file);
    const root = gltf.animations.length ? cloneSkinned(gltf.scene) : gltf.scene.clone(true);
    root.scale.setScalar(scale);
    root.traverse(o => { if (o.isMesh && tint) { o.material = o.material.clone(); o.material.emissive = new THREE.Color(tint); o.material.emissiveIntensity = 0.25; } });
    if (idle) { const clip = gltf.animations.find(c => c.name === idle); if (clip) { const m = new THREE.AnimationMixer(root); m.clipAction(clip).play(); m.update(0.4); } }
    thumbScene.add(root);
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z) / 2;
    const dist = radius / Math.tan(THREE.MathUtils.degToRad(thumbCamera.fov / 2)) * 1.25;
    thumbCamera.position.set(center.x + dist * 0.6, center.y + dist * 0.35, center.z + dist * 0.75);
    thumbCamera.lookAt(center);
    thumbRenderer.render(thumbScene, thumbCamera);
    const url = thumbRenderer.domElement.toDataURL('image/png');
    thumbScene.remove(root);
    return url;
  }).catch(e => { console.warn('thumb failed', file, e); return ''; });
  thumbQueue = p;
  thumbCache.set(key, p);
  return p;
}

const TABS = {
  creatures: { animated: true, groups: () => FAMILIES.map(f => ({ title: f.name, items: f.creatures.map(c => ({ ...c, source: f.source })) })) },
  classes: { animated: false, isClass: true, groups: () => [
    { title: 'Free classes', items: CLASSES.filter(c => c.tier === 'Free') },
    { title: 'Premium classes', items: CLASSES.filter(c => c.tier === 'Premium') },
  ] },
  weapons: { animated: false, groups: () => files.weapons.map(p => ({ title: `${p.pack} · ${p.license}`, items: p.items.map(i => ({ ...i, pack: p.pack, license: p.license })) })) },
  props: { animated: false, groups: () => files.props.map(p => ({ title: `${p.pack} · ${p.license}`, items: p.items.map(i => ({ ...i, pack: p.pack, license: p.license })) })) },
};

let tab = 'creatures';
function renderList() {
  const q = $('filter').value.trim().toLowerCase();
  const list = $('list');
  list.innerHTML = '';
  const cfg = TABS[tab];
  for (const g of cfg.groups()) {
    const items = g.items.filter(i => !q || (i.id ?? i.name).toLowerCase().includes(q));
    if (!items.length) continue;
    const h = document.createElement('div'); h.className = 'group'; h.textContent = `${g.title} (${items.length})`; list.appendChild(h);
    for (const item of items) {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = cfg.animated ? animatedCard(item)
        : cfg.isClass ? `<img class="thumb" alt=""><div><b>${item.id}</b><small>${item.role} · ${item.weapon}</small><small><br>${item.passive}</small></div>`
        : `<img class="thumb" alt=""><b>${item.name}</b>`;
      el.onclick = () => { for (const c of list.querySelectorAll('.card')) c.classList.remove('active'); el.classList.add('active'); cfg.animated ? showAnimated(item) : cfg.isClass ? showClass(item) : showStatic(item); };
      list.appendChild(el);
      const img = el.querySelector('.thumb');
      const opts = cfg.animated ? { scale: item.scale, tint: item.tint, idle: item.anims.idle } : {};
      renderThumb(cfg.animated || cfg.isClass ? item.model : item.file, opts).then(url => { if (url) img.src = url; });
    }
  }
}

function setTab(name) {
  tab = TABS[name] ? name : 'creatures';
  for (const a of document.querySelectorAll('#tabs a')) a.classList.toggle('active', a.dataset.tab === tab);
  const animated = TABS[tab].animated;
  $('animated-controls').classList.toggle('hidden', !animated);
  $('static-controls').classList.toggle('hidden', animated);
  $('sounds-h').classList.toggle('hidden', !animated);
  $('sounds').classList.toggle('hidden', !animated);
  $('hud').classList.toggle('hidden', false);
  clear();
  loadSeq++;
  renderList();
  const first = $('list').querySelector('.card');
  if (first) first.click();
}
for (const a of document.querySelectorAll('#tabs a')) a.onclick = e => { e.preventDefault(); location.hash = a.dataset.tab; setTab(a.dataset.tab); };
$('filter').oninput = renderList;
addEventListener('hashchange', () => setTab(location.hash.slice(1)));

// --- loop -------------------------------------------------------------------------------
function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  if (current?.animated) {
    current.mixer.update(dt);
    if ((current.state === 'walk' || current.state === 'run') && $('chk-footsteps').checked) {
      current.stepTimer -= dt;
      if (current.stepTimer <= 0) { play(current.def.sounds.step, 0.35); current.stepTimer = current.state === 'run' ? 0.28 : 0.45; }
    }
  } else if (current && $('chk-spin').checked) {
    current.root.rotation.y += dt * 0.6;
  }
  controls.update();
  renderer.render(scene, camera);
}
tick();
setTab(location.hash.slice(1) || 'creatures');
</script>
</body>
</html>
